[package]
name = "spotifm"
version = "3.1.0"
edition = "2021"

[[bin]]
name = "spotifm"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[dependencies]
librespot = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots", "with-libmdns", "passthrough-decoder"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
warp = { version = "0.3", features = ["tls"] }
tokio = { version = "1", features = ["macros", "signal", "sync", "process", "rt", "time"] }
rustls = { version = "0.23.23", features = ["ring"] }
serde = "1.0.106"
serde_json = "1.0.51"
rspotify = { version = "0.14.0", default-features = false, features = ["client-reqwest", "reqwest-rustls-tls"] }
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
futures-util = "0.3"
vergen = "9.0.6"
rand = "0.8"
gstreamer = "0.22"
gstreamer-app = "0.22"
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
toml = "0.8"
url = "2.5"
percent-encoding = "2.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

[build-dependencies]
cc = "1.0"
